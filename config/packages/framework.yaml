framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # CSRF protection
    csrf_protection: true

    # Enables session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    # PHP files cache
    php_errors:
        log: true

    # Assets
    assets:
        version_strategy: 'Symfony\Component\Asset\VersionStrategy\ContentHashVersionStrategy'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
